services:
  mysql:
    image: mysql:8.0
    container_name: money-book-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: money_book
      MYSQL_USER: moneybook
      MYSQL_PASSWORD: moneybook1234
    volumes:
      - money-book-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  money-book-mysql-data:
